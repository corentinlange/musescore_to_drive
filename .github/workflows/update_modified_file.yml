name: Update modified musescore on drive

# GitHubBot automatic workflow: Detects modified .mscz files, processes them, and uploads to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - "**/*.mscz"
  workflow_dispatch:

jobs:
  get-changed-files:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix }}
      has_changes: ${{ steps.changed-files.outputs.any_changed }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.mscz
          json: true
          escape_json: false

      - name: Create matrix from changed files
        id: create-matrix
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # all_changed_files est déjà en JSON array
          MATRIX='${{ steps.changed-files.outputs.all_changed_files }}'
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Changed files:"
          echo "$MATRIX" | jq -r '.[]'

  process-files:
    needs: get-changed-files
    if: needs.get-changed-files.outputs.has_changes == 'true'
    strategy:
      matrix:
        file: ${{ fromJson(needs.get-changed-files.outputs.matrix) }}
      fail-fast: false
      max-parallel: 5
    
    uses: ./.github/workflows/process_musescore.yml
    with:
      file_to_process: ${{ matrix.file }}
    secrets:
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}