name: Process MuseScore File (Reusable)

on:
  workflow_call:
    inputs:
      file_to_process:
        description: 'Single file to process'
        required: true
        type: string
    secrets:
      GCP_SERVICE_ACCOUNT_KEY_B64:
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/corentinlange/musescore_to_drive/musescore-processor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Convert MSCZ to PDF and MP3
        run: |
          echo "Processing: ${{ inputs.file_to_process }}"
          bash ./src/musescore/process.sh "${{ inputs.file_to_process }}"

      - name: Upload to Drive
        env:
          GCP_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_B64 }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
        run: |
          # Decode service account
          export SERVICE_ACCOUNT=$(echo "$GCP_SERVICE_ACCOUNT_KEY_B64" | base64 -d)
          
          # Upload all output files
          python3 src/drive-api/upload_all.py output
