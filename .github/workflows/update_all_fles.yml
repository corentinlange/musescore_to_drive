name: Update all musescore on drive

on:
  workflow_dispatch:

jobs:
  get-all-files:
    runs-on: ubuntu-22.04
    outputs:
      files: ${{ steps.find-files.outputs.files }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Find all MSCZ files
        id: find-files
        run: |
          FILES=$(ls *.mscz 2>/dev/null || echo "")
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Found files: $FILES"

  process-files:
    needs: get-all-files
    uses: ./.github/workflows/process_musescore.yml
    with:
      files_to_process: ${{ needs.get-all-files.outputs.files }}
    secrets:
      GCP_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_B64 }}